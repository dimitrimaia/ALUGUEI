# Gera o APK do app Android na nuvem do GitHub (sem Android Studio).
# Rode em: GitHub → Actions → "App Android (APK)" → Run workflow.
# O APK fica para baixar no fim da execução, em "Artifacts".
name: App Android (APK)

on:
  workflow_dispatch:
  push:
    paths: ["android/**", "capacitor.config.ts", ".github/workflows/android.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # O runner do GitHub já traz o Android SDK (ANDROID_HOME); o Gradle baixa o que faltar.
      - run: pnpm install --frozen-lockfile
      - run: npx cap sync android
      - name: Testes e APK
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aluguei-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      # Play Store: com a chave de envio nos segredos do repositório, gera também o AAB
      # assinado (docs/play-store.md). Sem os segredos, este passo não faz nada.
      - name: AAB assinado para a Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ALUGUEI_KEYSTORE_BASE64 }}
          ALUGUEI_KEYSTORE_SENHA: ${{ secrets.ALUGUEI_KEYSTORE_SENHA }}
          ALUGUEI_CHAVE_ALIAS: ${{ secrets.ALUGUEI_CHAVE_ALIAS }}
          ALUGUEI_CHAVE_SENHA: ${{ secrets.ALUGUEI_CHAVE_SENHA }}
        working-directory: android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Sem chave de envio: pulando o AAB da Play Store."; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/envio.jks"
          export ALUGUEI_KEYSTORE_ARQUIVO="$RUNNER_TEMP/envio.jks"
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/envio.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: aluguei-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 30
