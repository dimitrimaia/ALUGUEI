apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "xyz.aluguei.app"  // pacote do código; o id na loja é o applicationId
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "aluguei.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Cada build do GitHub Actions é uma versão nova (o atualizador do app compara este número).
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger())
        versionName "1.0." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    testOptions {
        // Os testes JUnit do plantão (Calculo, LeitorOferta, Formato, Preferencias, Volta) são Kotlin puro.
        unitTests.returnDefaultValues = true
    }
    // Assinatura do release pelo ambiente (CI); sem as variáveis, o release sai sem assinatura.
    def ksArquivo = System.getenv("ALUGUEI_KEYSTORE_ARQUIVO")
    def ksSenha = System.getenv("ALUGUEI_KEYSTORE_SENHA")
    def chaveAlias = System.getenv("ALUGUEI_CHAVE_ALIAS")
    def chaveSenha = System.getenv("ALUGUEI_CHAVE_SENHA")
    def assinar = ksArquivo && ksSenha && chaveAlias && chaveSenha && file(ksArquivo).exists()
    // Chave só do APK direto (fora da Play Store): a mesma em todo build, para o
    // APK novo instalar por cima do antigo. Segredos ALUGUEI_APK_* (docs/app-nativo.md).
    def apkArquivo = System.getenv("ALUGUEI_APK_KEYSTORE_ARQUIVO")
    def apkSenha = System.getenv("ALUGUEI_APK_SENHA")
    def assinarApk = apkArquivo && apkSenha && file(apkArquivo).exists()
    signingConfigs {
        if (assinarApk) {
            direto {
                storeFile file(apkArquivo)
                storePassword apkSenha
                keyAlias "aluguei-apk"
                keyPassword apkSenha
            }
        }
        if (assinar) {
            release {
                storeFile file(ksArquivo)
                storePassword ksSenha
                keyAlias chaveAlias
                keyPassword chaveSenha
            }
        }
    }
    buildTypes {
        // APK direto (atualiza pelo próprio app): com a chave de envio, sai sempre com a
        // mesma assinatura e instala por cima. Sem ela, cada build tem uma chave diferente.
        debug {
            if (assinarApk) signingConfig signingConfigs.direto
            else if (assinar) signingConfig signingConfigs.release
        }
        release {
            // Play Store: a chave de envio própria, ou, sem ela, a mesma do APK direto
            // (o Google re-assina com a chave dele; a de envio só prova que é você).
            if (assinar) signingConfig signingConfigs.release
            else if (assinarApk) signingConfig signingConfigs.direto
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // org.json de verdade nos testes JUnit (o android.jar dos testes só tem os nomes).
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Mesmo alvo de JVM do Java (capacitor.build.gradle usa Java 21).
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
